<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellness Dashboard</title>
    
    <!-- AOS (Animate On Scroll) -->
    <link href="https://unpkg.com/aos@2/dist/aos.css" rel="stylesheet">
    
    <!-- Lottie Player for animations -->
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Righteous&display=swap');
        
        /* Contemporary Palette */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.65); 
            --glass-border: rgba(255, 255, 255, 0.8);
            --text-dark: #2c3e50;
            --primary-blue: #3498db;
            --primary-yellow: #f1c40f;
            --accent: #2980b9;
            --success-green: #2ecc71;
            --transition-smooth: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Righteous', cursive;
            color: var(--text-dark);
            overflow-x: hidden;
            
            /* Using the beautiful rainbow ocean view with a 60% white wash */
            background-image: linear-gradient(rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.6)), url('2M.JPG');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        /* --- Navigation Menu Animations --- */
        .main-nav {
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 100;
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .main-nav a {
            text-decoration: none;
            color: var(--text-dark);
            font-size: 1rem;
            padding: 8px 16px;
            border-radius: 20px;
            transition: var(--transition-smooth);
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .main-nav a::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--primary-blue);
            z-index: -1;
            transition: left 0.3s ease;
        }

        .main-nav a:hover::before, .main-nav a.active::before {
            left: 0;
        }

        .main-nav a:hover, .main-nav a.active {
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
        }

        .header-bar {
            width: 90%;
            max-width: 800px;
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
            z-index: 10;
            animation: fadeInRight 0.8s ease-out 0.2s both;
        }

        @keyframes fadeInRight {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .lang-select {
            padding: 8px 15px;
            border-radius: 20px;
            border: 2px solid rgba(52, 152, 219, 0.3);
            background: rgba(255, 255, 255, 0.9);
            color: var(--accent);
            font-family: 'Righteous', cursive;
            font-size: 0.95rem;
            cursor: pointer;
            outline: none;
            transition: var(--transition-smooth);
        }

        .lang-select:hover, .lang-select:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.2);
            transform: translateY(-2px);
        }

        /* --- Dashboard Container --- */
        .container {
            position: relative;
            z-index: 10;
            max-width: 800px;
            width: 90%;
            margin-top: 2vh;
            margin-bottom: 6vh;
            text-align: center;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 50px 40px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
            animation: scaleIn 0.7s ease-out 0.3s both;
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .greeting {
            font-size: 3rem;
            color: var(--primary-blue);
            margin: 0;
            letter-spacing: 1px;
            animation: fadeInUp 0.8s ease-out 0.4s both;
            background: linear-gradient(135deg, var(--primary-blue), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .sub-greeting {
            font-size: 1.2rem;
            color: #555;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin-top: 10px;
            margin-bottom: 40px;
            animation: fadeInUp 0.8s ease-out 0.5s both;
        }

        /* --- Dashboard Grid --- */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid white;
            border-radius: 16px;
            padding: 30px 20px;
            text-decoration: none;
            color: var(--text-dark);
            transition: var(--transition-smooth);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 5px solid transparent;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.8s ease-out both;
        }

        .card:nth-child(1) {
            animation-delay: 0.6s;
        }

        .card:nth-child(2) {
            animation-delay: 0.7s;
        }

        .card:nth-child(3) {
            animation-delay: 0.8s;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
            z-index: 1;
        }

        .card:hover::before {
            left: 100%;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.02);
            background: white;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            border-bottom-width: 6px;
        }

        .card-journal { border-bottom-color: var(--primary-blue); }
        .card-breathe { border-bottom-color: var(--success-green); }
        .card-tracker { border-bottom-color: var(--primary-yellow); }

        .card h3 {
            margin: 0 0 10px 0;
            font-size: 1.5rem;
            color: var(--accent);
            transition: var(--transition-smooth);
            position: relative;
            z-index: 2;
        }

        .card:hover h3 {
            transform: scale(1.05);
        }

        .card p {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 0.95rem;
            color: #666;
            transition: var(--transition-smooth);
            position: relative;
            z-index: 2;
        }

        .card:hover p {
            color: #333;
            transform: translateY(2px);
        }

        /* Card Icon Container */
        .card-icon {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            transition: var(--transition-smooth);
            position: relative;
            z-index: 2;
        }

        .card-journal .card-icon {
            background: rgba(52, 152, 219, 0.1);
            color: var(--primary-blue);
        }

        .card-breathe .card-icon {
            background: rgba(46, 204, 113, 0.1);
            color: var(--success-green);
        }

        .card-tracker .card-icon {
            background: rgba(241, 196, 15, 0.1);
            color: var(--primary-yellow);
        }

        .card:hover .card-icon {
            transform: scale(1.15) rotate(5deg);
        }

        .card-icon svg {
            width: 40px;
            height: 40px;
        }

        /* --- Quote Section --- */
        .quote-box {
            background: rgba(255, 255, 255, 0.5);
            padding: 20px;
            border-radius: 12px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-style: italic;
            color: #444;
            font-size: 1.1rem;
            animation: fadeInUp 0.8s ease-out 0.9s both;
            border-left: 4px solid var(--primary-blue);
            transition: var(--transition-smooth);
        }

        .quote-box:hover {
            background: rgba(255, 255, 255, 0.7);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.1);
            transform: translateX(5px);
        }

        /* Pulse animation for elements */
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        .pulse {
            animation: pulse 3s ease-in-out infinite;
        }

        /* Mobile responsiveness */
        @media (max-width: 600px) {
            .greeting {
                font-size: 2rem;
            }

            .container {
                padding: 30px 20px;
            }

            .main-nav {
                gap: 10px;
            }

            .main-nav a {
                font-size: 0.9rem;
                padding: 6px 12px;
            }
        }
    </style>
</head>
<body>

    <nav class="main-nav">
        <a href="index.html" id="navHome" class="active">Home</a>
        <a href="NewLayout.html" id="navJournal">Journal Timer</a>
        <a href="breathe.html" id="navBreathe">Breathe</a>
        <a href="tracker.html" id="navTracker">Tracker</a>
        <a href="archive.html" id="navArchive">Archive</a>
        <a href="settings.html" id="navSettings">Settings</a>
    </nav>

    <div class="header-bar">
        <select class="lang-select" id="langSelect" onchange="changeLanguage()">
            <option value="en">English</option>
            <option value="hi">हिंदी (Hindi)</option>
            <option value="ta">தமிழ் (Tamil)</option>
        </select>
    </div>

    <div class="container">
        <h1 class="greeting" id="greetingText">Good Morning.</h1>
        <p class="sub-greeting" id="subGreeting">Welcome back. Take a deep breath.</p>

        <div class="dashboard-grid">
            <a href="NewLayout.html" class="card card-journal">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                    </svg>
                </div>
                <h3 id="card1Title">Journal</h3>
                <p id="card1Desc">15-minute guided reset</p>
            </a>

            <a href="breathe.html" class="card card-breathe">
                <div class="card-icon pulse">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="1"></circle>
                        <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4"></path>
                        <path d="M12 4c-4.42 0-8 3.58-8 8s3.58 8 8 8 8-3.58 8-8-3.58-8-8-8"></path>
                    </svg>
                </div>
                <h3 id="card2Title">Breathe</h3>
                <p id="card2Desc">Quick calming exercises</p>
            </a>

            <a href="tracker.html" class="card card-tracker">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <polyline points="19 12 12 19 5 12"></polyline>
                    </svg>
                </div>
                <h3 id="card3Title">Tracker</h3>
                <p id="card3Desc">Log your energy today</p>
            </a>
        </div>

        <div class="quote-box" id="quoteBox">
            "You are exactly where you need to be."
        </div>
    </div>

    <!-- GSAP for advanced animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <!-- AOS initialization -->
    <script>
        AOS.init({
            duration: 1000,
            easing: 'ease-in-out-quad',
            once: false,
            mirror: true
        });
    </script>

    <script>
        // --- Dynamic Greeting Logic ---
        function getGreetingKey() {
            const hour = new Date().getHours();
            if (hour < 12) return 'morning';
            if (hour < 18) return 'afternoon';
            return 'evening';
        }

        // --- Translation Dictionary ---
        const i18n = {
            en: {
                navHome: "Home", navJournal: "Journal Timer", navBreathe: "Breathe", navTracker: "Tracker", navArchive: "Archive", navSettings: "Settings",
                morning: "Good Morning.",
                afternoon: "Good Afternoon.",
                evening: "Good Evening.",
                sub: "Welcome back. Take a deep breath.",
                c1Title: "Journal", c1Desc: "15-minute guided reset",
                c2Title: "Breathe", c2Desc: "Quick calming exercises",
                c3Title: "Tracker", c3Desc: "Log your energy today",
                quote: "\"You are exactly where you need to be.\""
            },
            hi: {
                navHome: "मुख्य पृष्ठ", navJournal: "जर्नल टाइमर", navBreathe: "सांस लें", navTracker: "ट्रैकर", navArchive: "संग्रह", navSettings: "सेटिंग्स",
                morning: "सुप्रभात।",
                afternoon: "शुभ दोपहर।",
                evening: "शुभ संध्या।",
                sub: "वापसी पर स्वागत है। एक गहरी सांस लें।",
                c1Title: "जर्नल", c1Desc: "15-मिनट निर्देशित रीसेट",
                c2Title: "सांस लें", c2Desc: "त्वरित शांत करने वाले व्यायाम",
                c3Title: "ट्रैकर", c3Desc: "आज अपनी ऊर्जा लॉग करें",
                quote: "\"आप बिल्कुल वहीं हैं जहाँ आपको होना चाहिए।\""
            },
            ta: {
                navHome: "முகப்பு", navJournal: "நேரங்காட்டி", navBreathe: "சுவாசி", navTracker: "கண்காணிப்பான்", navArchive: "காப்பகம்", navSettings: "அமைப்புகள்",
                morning: "காலை வணக்கம்.",
                afternoon: "மதிய வணக்கம்.",
                evening: "மாலை வணக்கம்.",
                sub: "நல்வரவு. ஆழமாக மூச்சு விடவும்.",
                c1Title: "ஜர்னல்", c1Desc: "15 நிமிட வழிகாட்டப்பட்ட தியானம்",
                c2Title: "சுவாசி", c2Desc: "விரைவான அமைதி பயிற்சிகள்",
                c3Title: "கண்காணிப்பான்", c3Desc: "உங்கள் ஆற்றலைப் பதிவு செய்யவும்",
                quote: "\"நீங்கள் எங்கு இருக்க வேண்டுமோ அங்குதான் இருக்கிறீர்கள்.\""
            }
        };

        function changeLanguage() {
            const lang = document.getElementById('langSelect').value;
            const t = i18n[lang];
            const greetingKey = getGreetingKey();

            // Update Nav Menu
            document.getElementById('navHome').innerText = t.navHome;
            document.getElementById('navJournal').innerText = t.navJournal;
            document.getElementById('navBreathe').innerText = t.navBreathe;
            document.getElementById('navTracker').innerText = t.navTracker;
            document.getElementById('navArchive').innerText = t.navArchive;
            document.getElementById('navSettings').innerText = t.navSettings;

            // Update Dashboard Content
            document.getElementById('greetingText').innerText = t[greetingKey];
            document.getElementById('subGreeting').innerText = t.sub;
            
            document.getElementById('card1Title').innerText = t.c1Title;
            document.getElementById('card1Desc').innerText = t.c1Desc;
            
            document.getElementById('card2Title').innerText = t.c2Title;
            document.getElementById('card2Desc').innerText = t.c2Desc;
            
            document.getElementById('card3Title').innerText = t.c3Title;
            document.getElementById('card3Desc').innerText = t.c3Desc;
            
            document.getElementById('quoteBox').innerText = t.quote;
        }

        // Initialize language and greeting on load
        changeLanguage();

        // Add some interactive animations on card hover
        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('mouseenter', function() {
                gsap.to(this, { duration: 0.3, y: -10, ease: 'power2.out' });
            });
            card.addEventListener('mouseleave', function() {
                gsap.to(this, { duration: 0.3, y: 0, ease: 'power2.out' });
            });
        });
    </script>
</body>
</html>
