<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breathe & Reflect - Wellness Dashboard</title>
    
    <link href="https://unpkg.com/aos@2/dist/aos.css" rel="stylesheet">
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Quicksand:wght@300;400;500;600&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* Contemporary Earthy Meditation Palette */
        :root {
            --glass-bg: rgba(250, 247, 243, 0.6);
            --glass-border: rgba(180, 160, 140, 0.5);
            --text-dark: #3a3a3a;
            --text-light: #6b6b6b;
            
            /* Earthy Tones */
            --earth-brown: #8b7355;
            --warm-taupe: #a89968;
            --sage-earth: #8a9a7b;
            --clay-red: #b8735d;
            --bg-gradient: linear-gradient(135deg, #f4efe9 0%, #e5ded4 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Quicksand', sans-serif;
        }

        body {
          /* References your local background image directly */
            background: linear-gradient(rgba(244, 239, 233, 0.4), rgba(229, 222, 212, 0.4)), 
                        url('2M.JPG') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding-bottom: 60px;
        }

.container {
            position: relative;
            z-index: 10;
            max-width: 900px;
            width: 90%;
            margin: 2vh auto 6vh auto; /* Centers the container box on the page */
            text-align: center;
            background: rgba(250, 247, 243, 0.65);
            
            /* Inner card overlay layout */
            background-image: linear-gradient(rgba(250, 247, 243, 0.85), rgba(250, 247, 243, 0.85)), url('9M.JPG'); 
            background-size: cover;
            background-position: center;
            background-blend-mode: overlay;
            
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(180, 160, 140, 0.6);
            border-radius: 28px;
            padding: 80px 45px;
            box-shadow: 0 12px 40px rgba(139, 115, 85, 0.1);
            min-height: 500px;
        }

        /* Top Header Utility Control Bar */
        .header-bar {
            width: 100%;
            max-width: 1200px;
            padding: 20px 40px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            z-index: 10;
        }

        .lang-select {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 8px 16px;
            border-radius: 20px;
            color: var(--text-dark);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
        }

        .lang-select:hover {
            background: rgba(250, 247, 243, 0.9);
            border-color: var(--earth-brown);
        }

        /* Central Brand Glassmorphic Navigation Menu */
        .main-nav {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 15px 40px;
            border-radius: 40px;
            display: flex;
            gap: 30px;
            align-items: center;
            margin-bottom: 60px;
            box-shadow: 0 8px 32px 0 rgba(139, 115, 85, 0.15);
            z-index: 10;
        }

        .main-nav a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 600;
            font-size: 0.95rem;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .main-nav a:hover, .main-nav a.active {
            background: var(--earth-brown);
            color: #ffffff;
        }

        /* Main Screen Container Layout */
        .container {
            width: 100%;
            max-width: 1200px;
            padding: 0 40px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        /* Hero Greeting Area Grid Layout */
        .hero-section {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 40px;
            margin-bottom: 20px;
        }

        .welcome-group h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--text-dark);
            line-height: 1.1;
            margin-bottom: 10px;
        }

        .welcome-group p {
            font-size: 1.5rem;
            color: var(--text-light);
            font-weight: 400;
        }

        .user-name {
            font-weight: 600;
            color: var(--earth-brown);
        }

        /* Audio Interaction Controller Widget Block */
        .audio-widget {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 20px 30px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 8px 24px rgba(139, 115, 85, 0.08);
        }

        .audio-btn {
            background: var(--earth-brown);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            transition: all 0.3s ease;
            outline: none;
        }

        .audio-btn:hover {
            transform: scale(1.05);
            background: var(--warm-taupe);
        }

        .audio-icon {
            width: 22px;
            height: 22px;
        }

        .volume-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .volume-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-light);
            font-weight: 600;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 120px;
            height: 4px;
            border-radius: 2px;
            background: rgba(139, 115, 85, 0.3);
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--earth-brown);
            transition: all 0.2s ease;
        }

        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Responsive Dashboard 3-Card Grid System Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 280px;
            text-decoration: none;
            color: var(--text-dark);
            box-shadow: 0 10px 30px rgba(139, 115, 85, 0.05);
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            border-color: var(--earth-brown);
            box-shadow: 0 20px 40px rgba(139, 115, 85, 0.12);
        }

        .card-content h3 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .card-content p {
            font-size: 1.05rem;
            color: var(--text-light);
            line-height: 1.5;
        }

        /* Unique Color Coding Accents Per Dashboard Component Card */
        .card.journal h3 { color: var(--earth-brown); }
        .card.breathe h3 { color: var(--sage-earth); }
        .card.tracker h3 { color: var(--clay-red); }

        .card-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: 20px;
        }

        .arrow-icon {
            width: 24px;
            height: 24px;
            transition: transform 0.3s ease;
        }

        .card:hover .arrow-icon {
            transform: translateX(6px);
        }

        /* Typographic Literary Zen Blockquote Row Section */
        .quote-section {
            margin-top: 40px;
            text-align: center;
            padding: 40px;
        }

        .quote-box {
            font-family: 'Lora', serif;
            font-style: italic;
            font-size: 1.6rem;
            color: var(--text-light);
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Global Responsiveness Adapter Layer queries */
        @media (max-width: 992px) {
            .dashboard-grid { grid-template-columns: repeat(2, 1fr); }
            .hero-section { grid-template-columns: 1fr; justify-items: start; gap: 20px; }
        }

        @media (max-width: 768px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            .main-nav { padding: 15px 25px; gap: 15px; flex-wrap: wrap; justify-content: center; border-radius: 20px; }
            .welcome-group h1 { font-size: 2.8rem; }
            .header-bar { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <select class="lang-select" id="langSelect" onchange="changeLanguage()">
            <option value="en">English</option>
            <option value="hi">हिंदी (Hindi)</option>
            <option value="ta">தமிழ் (Tamil)</option>
        </select>
    </div>

    <nav class="main-nav">
        <a href="index.html" id="navHome" class="active">Home</a>
        <a href="NewLayout.html" id="navJournal">Journal Timer</a>
        <a href="breathe.html" id="navBreathe">Breathe</a>
        <a href="tracker.html" id="navTracker">Tracker</a>
        <a href="archive.html" id="navArchive">Archive</a>
        <a href="settings.html" id="navSettings">Settings</a>
        
        <div id="googleBtnContainer" style="display: inline-block; align-self: center; margin-left: 10px;"></div>
    </nav>

    <div class="container">
        
        <section class="hero-section" data-aos="fade-down">
            <div class="welcome-group">
                <h1 id="greetingText">Good Morning.</h1>
                <p id="subGreeting">Welcome back<span class="user-name" id="userName">, Mindful Achiever</span></p>
            </div>
            
		<audio id="meditationAudio" loop>
    		<source src="Background.mp3" type="audio/mpeg">
    		Your browser does not support the audio element.
		</audio>
            <div class="audio-widget">
                <button class="audio-btn" id="audioToggle" aria-label="Toggle Meditation Audio">
                    <svg class="audio-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <line x1="23" y1="9" x2="17" y2="15"></line>
                        <line x1="23" y1="15" x2="17" y2="9"></line>
                    </svg>
                </button>
                <div class="volume-container">
                    <span class="volume-label">Ambient Sound</span>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="40">
                </div>
            </div>
        </section>

        <main class="dashboard-grid">
            
            <a href="NewLayout.html" class="card journal" data-aos="fade-up" data-aos-delay="100">
                <div class="card-content">
                    <h3 id="card1Title">Journal</h3>
                    <p id="card1Desc">15-minute guided reset</p>
                </div>
                <div class="card-footer">
                    <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="var(--earth-brown)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </div>
            </a>

            <a href="breathe.html" class="card breathe" data-aos="fade-up" data-aos-delay="200">
                <div class="card-content">
                    <h3 id="card2Title">Breathe</h3>
                    <p id="card2Desc">Quick calming exercises</p>
                </div>
                <div class="card-footer">
                    <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="var(--sage-earth)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </div>
            </a>

            <a href="tracker.html" class="card tracker" data-aos="fade-up" data-aos-delay="300">
                <div class="card-content">
                    <h3 id="card3Title">Tracker</h3>
                    <p id="card3Desc">Log your energy today</p>
                </div>
                <div class="card-footer">
                    <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="var(--clay-red)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </div>
            </a>
        </main>

        <section class="quote-section" data-aos="fade-up" data-aos-delay="400">
            <p class="quote-box" id="quoteBox">"You are exactly where you need to be."</p>
        </section>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/aos@2/dist/aos.js"></script>
    <script>
        // Global Initialization Routine for Layout Animations Engine Framework
        AOS.init({
            duration: 1000,
            easing: 'ease-in-out-quad',
            once: false,
            mirror: true
        });
    </script>

    <script src="auth.js"></script>

    <script src="dashboard.js"></script>
</body>
</html>
